# Builds the Android app (APK) of the game and puts it on the "Android app" release:
#   https://github.com/drioppit96/Azerothautobattler/releases/tag/android-latest
# Runs after every push that changes the game (and by hand: Actions - Android APK - Run workflow).
# Signing: the secrets ANDROID_KEYSTORE_B64 (the keystore, base64) and ANDROID_KEYSTORE_PASSWORD - the same key every
# time, so a new version installs over the old one and keeps the saved characters. Without them the APK is signed with
# a throw-away debug key (installing it needs the old app removed first).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'gamedata/**'
      - 'android_app/**'
      - 'script/make_android.py'
      - '.github/workflows/android.yml'

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The game's files for the app
        run: |
          pip install pillow
          python script/make_android.py --root . --out android_app/app/src/main/assets/www

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/azeroth.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/azeroth.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=release key" >> "$GITHUB_ENV"
          else
            echo "SIGNED=debug key (set the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD secrets)" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: azeroth
        run: |
          export APP_VERSION="$(grep -o "GAME_VERSION = '[^']*'" game/game.js | cut -d"'" -f2)"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          gradle -p android_app assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp android_app/app/build/outputs/apk/release/app-release.apk out/AzerothAutoBattler.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: AzerothAutoBattler-apk
          path: out/AzerothAutoBattler.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android app (latest)
          prerelease: false
          make_latest: true
          files: out/AzerothAutoBattler.apk
          body: |
            Azeroth Auto Battler for Android - game version ${{ env.APP_VERSION }}, build ${{ github.run_number }} (${{ github.sha }}).
            Signed with the ${{ env.SIGNED }}.

            On the phone: open this page, tap AzerothAutoBattler.apk, then open the download and allow installing apps from this source when asked.
