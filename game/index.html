<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a160f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Azeroth Auto Battler</title>
<link rel="stylesheet" href="game.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">Azeroth <span>Auto&nbsp;Battler</span></div>
    <nav id="maptabs"></nav>
    <button id="btnRmark" class="mini rmtab" hidden title="Mark the way through this dungeon (a tool for while the game is being made)">&#9998; Route marker</button>
    <span id="floorSel" class="floorsel" hidden></span>
    <div class="spacer"></div>
    <div class="dd" id="ddView"><button class="mini ddb" title="What the map shows">Map view &#9662;</button>
      <div class="ddm">
        <label class="chk"><input type="checkbox" id="follow"> Follow the character</label>
        <label class="chk"><input type="checkbox" id="showroutes"> Routes</label>
        <label class="chk" title="Red: cannot walk there (mountains, cliffs, lava). Blue: swimming."><input type="checkbox" id="showterrain"> Terrain</label>
        <label class="chk" title="In a dungeon: where one cannot walk (walls, lava) in dark red"><input type="checkbox" id="showdgwalls"> Dungeon walls</label>
        <label class="chk"><input type="checkbox" id="showmobs" checked> Creatures</label>
        <label class="chk" title="Herb and ore nodes you have gathered once"><input type="checkbox" id="shownodes" checked> Nodes</label>
        <label class="chk apponly" title="Only the creatures around your characters are in the world (less memory and battery). Reloads the game."><input type="checkbox" id="lightworld"> Light world</label>
        <button id="hdmaps" class="mini hdbtn on" title="High resolution terrain map over the normal one">HD map</button>
      </div>
    </div>
    <div class="dd" id="ddSpeed"><button class="mini ddb" id="speedBtn" title="Game speed (space: pause)">Speed 1x &#9662;</button>
      <div class="ddm">
        <div class="seg" id="speed">
          <button data-s="0" title="Pause">&#10074;&#10074; Pause</button>
          <button data-s="1" class="on">1x</button>
          <button data-s="2">2x</button>
          <button data-s="4">4x</button>
          <button data-s="8" title="Fast forward">8x</button>
        </div>
      </div>
    </div>
    <button id="btnRaid" class="mini" title="Raid panel: orders for your battleground raid" hidden>Raid</button>
    <button id="btnMeter" class="mini" title="Damage meter">DPS</button>
    <button id="btnChars" class="mini" title="Switch, create or delete characters">Characters</button>
    <button id="btnSave" class="mini" title="Download all characters as a file">Export</button>
    <button id="btnLoad" class="mini" title="Load characters from a file">Import</button>
    <input type="file" id="fileLoad" accept=".json" hidden>
  </header>
  <aside id="left">
    <section class="card" id="charCard"></section>
    <section class="card" id="orderCard"></section>
    <section class="card" id="groupCard"></section>
    <section class="card grow" id="raidCtl" hidden></section>
    <section class="card grow" id="logCard"><h3>Log</h3><div id="log"></div></section>
  </aside>
  <main id="mapwrap">
    <canvas id="map"></canvas>
    <div id="rmPanel" hidden></div>
    <div id="hud"><span id="coords">&nbsp;</span><span id="zonehint"></span></div>
    <div id="legend">
      <i style="background:#e0453a"></i>attacks <i style="background:#e6b93c"></i>neutral
      <i style="background:#4fc26b"></i>friendly <i style="background:#8a8f9c"></i>untargetable
    </div>
    <div id="abar"></div>
    <div id="mhud"><div id="mhudL"></div><div id="mhudR"></div></div>
    <div id="mapctl"><button id="mcIn" title="Zoom in">+</button><button id="mcOut" title="Zoom out">&minus;</button><button id="mcFollow" title="Follow the character">&#9678;</button><button id="mcPause" title="Pause">&#10074;&#10074;</button></div>
    <div id="menu" hidden></div>
    <div id="tip" hidden></div>
    <div id="loading"><div><b>Loading game data</b><div id="loadmsg"></div></div></div>
  </main>
  <nav id="mnav"><button data-p="map" class="on">Map</button><button data-p="left">Hero</button><button data-p="right">Quests &amp; gear</button><button data-p="sheet">Bags</button></nav>
  <aside id="right">
    <section class="card" id="infoCard"><h3>Selection</h3><div class="muted">Click a creature, a graveyard or the ground on the map.</div></section>
    <section class="card bgcard" id="bgCard" hidden></section>
    <section class="card dgcard" id="dgCard" hidden></section>
    <section class="card" id="questCard"></section>
    <section class="card" id="gearCard"></section>
    <section class="card" id="setCard"></section>
  </aside>
</div>
<div id="sheet" class="modal" hidden>
  <div class="sheet-win">
    <div class="sheet-head"><span id="sheetGroup"></span><nav id="sheetTabs"><button data-tab="char" class="on">Character</button><button data-tab="talents">Talents</button><button data-tab="beh">Abilities &amp; behaviour</button><button data-tab="pet" id="petTabBtn">Pet</button><button data-tab="prof">Professions</button><button data-tab="vendor">Vendor</button><button data-tab="ah">Auction house</button><button data-tab="bank">Bank</button><button data-tab="trade">Trade</button><button data-tab="guild">Guild</button></nav><button id="sheetPrev" class="mini sharr" title="Previous character">&#9664;</button><span id="sheetTitle"></span><button id="sheetNext" class="mini sharr" title="Next character">&#9654;</button><button id="sheetClose" class="mini">&#10005;</button></div>
    <div class="sheet-body"><section id="sheetLeft"></section><section id="sheetBags"></section></div>
  </div>
</div>
<div id="itip" hidden></div>
<div id="iact" hidden></div>
<script>if (/AzerothApp/.test(navigator.userAgent)) document.documentElement.classList.add('app');</script>
<script src="../gamedata/mobmap_data.js"></script>
<script src="../gamedata/nav.js"></script>
<script src="collision.js"></script>
<script src="worldmap.js"></script>
<script src="combat.js"></script>
<script src="items.js"></script>
<script src="abilities.js"></script>
<script src="classes.js"></script>
<script src="pets.js"></script>
<script src="mobspells.js"></script>
<script src="sheet.js"></script>
<script src="unitframes.js"></script>
<script src="vfx.js"></script>
<script src="quests.js"></script>
<script src="talents.js"></script>
<script src="leveling.js"></script>
<script src="professions.js"></script>
<script src="dungeons.js"></script>
<script src="mercs.js"></script>
<script src="consumables.js"></script>
<script src="rotations.js"></script>
<script src="meter.js"></script>
<script src="mastery.js"></script>
<script src="pullplan.js"></script>
<script src="group.js"></script>
<script src="fishing.js"></script>
<script src="trade.js"></script>
<script src="shop.js"></script>
<script src="hearth.js"></script>
<script src="reputation.js"></script>
<script src="groupquest.js"></script>
<script src="routemarker.js"></script>
<script src="tactics.js"></script>
<script src="tactics_presets.js"></script>
<script src="tactics_ui.js"></script>
<script src="away.js"></script>
<script src="farm.js"></script>
<script src="workshop.js"></script>
<script src="guild.js"></script>
<script src="market.js"></script>
<script src="charscreen.js"></script>
<script src="looks.js"></script>
<script src="mounts.js"></script>
<script src="pvp.js"></script>
<script src="pvptactics.js"></script>
<script src="game.js"></script>
</body>
</html>
